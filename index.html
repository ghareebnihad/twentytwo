<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sukun Menu</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Noto+Sans+Arabic:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body id="bodyTag">

  <div id="appContent" class="visible">
    <header class="header">
      <img src="https://github.com/ghareebnihad/twentytwo/blob/main/image-removebg-preview.png?raw=true" class="logo" alt="Sukun Logo">
    </header>

    <!-- Arama ve Görünüm Seçici (Grid / List) -->
    <div class="controls-container">
      <div class="search-container">
        <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن المشروبات والحلويات..." oninput="filterMenu()">
      </div>

      <!-- Görünüm Butonları -->
      <div class="view-toggle-btns">
        <button id="gridBtn" class="view-btn active" onclick="switchView('grid')" title="شبكة (2x2)">
          <svg viewBox="0 0 24 24"><path d="M3 3h8v8H3V3m10 0h8v8h-8V3M3 13h8v8H3v-8m10 0h8v8h-8v-8Z"/></svg>
        </button>
        <button id="listBtn" class="view-btn" onclick="switchView('list')" title="قائمة (Alt Alta)">
          <svg viewBox="0 0 24 24"><path d="M3 4h18v2H3V4m0 7h18v2H3v-2m0 7h18v2H3v-2Z"/></svg>
        </button>
      </div>
    </div>

    <!-- Kategori Butonları (Yan Yana ve %30 Küçültülmüş) -->
    <div class="category-buttons" id="categoryContainer">
      <!-- Sıcak Kahve -->
      <button class="cat-btn active" onclick="filterCategory('hot', this)">
        <svg class="cat-icon" viewBox="0 0 24 24"><path d="M2 21h20v-2H2v2m2-4h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1m2-7h12v6H6V9m13-6H5v2h14V3Z"/></svg>
        <span>القهوة الساخنة</span>
      </button>

      <!-- Özel Çay -->
      <button class="cat-btn" onclick="filterCategory('tea', this)">
        <svg class="cat-icon" viewBox="0 0 24 24"><path d="M20 3H4v10c0 2.21 1.79 4 4 4h6c2.21 0 4-1.79 4-4v-3h2c1.11 0 2-.89 2-2V5c0-1.11-.89-2-2-2m0 5h-2V5h2v3zM2 21h20v2H2v-2Z"/></svg>
        <span>الشاي الخاص</span>
      </button>

      <!-- Milkshake -->
      <button class="cat-btn" onclick="filterCategory('milkshake', this)">
        <svg class="cat-icon" viewBox="0 0 24 24"><path d="M11 2v2h2V2h-2m-5.1 4L7 8.4l1.4-1.4L7 5.6 5.9 6.7M17 6.7l-1.1-1.1-1.4 1.4L15.6 8.4 17 6.7M12 6c-3.31 0-6 2.69-6 6 0 2.97 2.16 5.43 5 5.92V20H9v2h6v-2h-2v-2.08c2.84-.49 5-2.95 5-5.92 0-3.31-2.69-6-6-6Z"/></svg>
        <span>میلک شیک</span>
      </button>

      <!-- Soğuk İçecek -->
      <button class="cat-btn" onclick="filterCategory('cold', this)">
        <svg class="cat-icon" viewBox="0 0 24 24"><path d="M7 2h10v2H7V2m13.2 4H3.8c-.4 0-.7.4-.5.8l2.6 13c.2 1 1 1.7 2 1.7h8.2c1 0 1.8-.7 2-1.7l2.6-13c.2-.4-.1-.8-.5-.8M12 15c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2Z"/></svg>
        <span>المشروبات الباردة</span>
      </button>

      <!-- Taze Meyve Suyu -->
      <button class="cat-btn" onclick="filterCategory('juice', this)">
        <svg class="cat-icon" viewBox="0 0 24 24"><path d="M3 2h18v2H3V2m0 4h18v2H3V6m2 4h14l-1 11H6L5 10m5 3v5h2v-5h-2Z"/></svg>
        <span>العصائر الطبیعیە</span>
      </button>

      <!-- Smoothie -->
      <button class="cat-btn" onclick="filterCategory('smoothie', this)">
        <svg class="cat-icon" viewBox="0 0 24 24"><path d="M6 2h12v2H6V2M5 6h14l-1.5 14h-11L5 6m6 3v8h2V9h-2Z"/></svg>
        <span>سموذي</span>
      </button>

      <!-- Mojito -->
      <button class="cat-btn" onclick="filterCategory('mojito', this)">
        <svg class="cat-icon" viewBox="0 0 24 24"><path d="M5.5 3h13c.6 0 1 .4 1 1 0 .2-.1.4-.2.6l-5.8 8.7V19h3v2H7.5v-2h3v-5.7L4.7 4.6c-.4-.5-.1-1.6.8-1.6m2.4 2l4.1 6.1L16.1 5H7.9Z"/></svg>
        <span>الموهیتو</span>
      </button>

      <!-- Tatlılar -->
      <button class="cat-btn" onclick="filterCategory('dessert', this)">
        <svg class="cat-icon" viewBox="0 0 24 24"><path d="M12 2C8 2 4 4 4 8c0 2 1 3.5 2.5 4.5C6.2 13.5 6 14.5 6 16c0 3 2 6 6 6s6-3 6-6c0-1.5-.2-2.5-.5-3.5C19 11.5 20 10 20 8c0-4-4-6-8-6m0 2c3.31 0 6 1.34 6 4 0 1.25-.75 2.5-2 3.3L15 12h-6l-1-0.7C6.75 10.5 6 9.25 6 8c0-2.69 2.69-4 6-4Z"/></svg>
        <span>الحلويات</span>
      </button>
    </div>

    <main id="menuContainer">
      <div class="loading-text">جاري تحميل القائمة...</div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
